  <main>
    <section class="contato-form">
      <h2>Fale com a Organização</h2>
      <form>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

        <label for="email">E-mail Institucional:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@aluno.ifal.edu.br" required>

        <label for="mensagem">Sua Mensagem / Dúvida:</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva aqui..." required></textarea>

        <button type="submit">Enviar Mensagem</button>
      </form>
    </section>
  </main>

  <footer class="rodape">
